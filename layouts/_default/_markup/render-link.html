{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}
   {{- if $u.IsAbs }} class="link-out" target="_blank" rel="external noopener noreferrer"{{ end }}>
  {{- if $u.IsAbs -}}
    <i class="bi bi-box-arrow-up-right link-external" aria-hidden="true"></i>
  {{- end -}}
  {{- .Text | safeHTML -}}
  {{- if $u.IsAbs }}<span class="visually-hidden"> (opens in a new tab)</span>{{ end -}}
</a>
