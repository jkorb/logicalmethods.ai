{{/* The margin rule doubles as a reading indicator: the part you have read is
     inked in, the rest stays faint, and each section is a tick you can jump
     back to. Built by JS from the headings, so it degrades to nothing. */}}
<div class="progress-rail" data-progress-rail aria-hidden="true">
  <span class="progress-rail__track"></span>
  <span class="progress-rail__fill"></span>
</div>
