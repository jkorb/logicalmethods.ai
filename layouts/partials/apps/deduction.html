<section class="logic-app nd-app" data-logic-app="deduction" data-kind="{{ .sc.Get "kind" | default "canvas" }}" data-display="{{ .sc.Get "display" }}" data-code="{{ .sc.Get "code" }}" data-deck="{{ .sc.Get "deck" }}" data-example="{{ .sc.Get "example" | default "heating" }}" aria-label="{{ .sc.Get "title" | default "Natural deduction" }}">
  <template data-check-icon>{{ partial "apps/icon.html" "check" }}</template>
  <template data-reset-icon>{{ partial "apps/icon.html" "restart" }}</template>
  <template data-access-icon>{{ partial "apps/icon.html" "accessibility" }}</template>
  <template data-save-icon>{{ partial "apps/icon.html" "save" }}</template>
  <template data-load-icon>{{ partial "apps/icon.html" "load" }}</template>
  <template data-hint-icon>{{ partial "apps/icon.html" "hint" }}</template>
  <template data-previous-icon>{{ partial "apps/icon.html" "previous" }}</template>
  <template data-next-icon>{{ partial "apps/icon.html" "next" }}</template>
  <template data-fullscreen-icon>{{ partial "apps/icon.html" "fullscreen" }}</template>
  <template data-edit-icon>{{ partial "apps/icon.html" "edit" }}</template>
  <template data-lean-icon>{{ with resources.Get "img/lang/lean.svg" }}{{ .Content | safeHTML }}{{ end }}</template>
  <div data-nd-mount></div>
  <noscript>Enable JavaScript to use the proof canvas. The surrounding text explains the rules and derivations.</noscript>
</section>
