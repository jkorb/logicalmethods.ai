{{- $chapter := .Get "chapter" -}}
{{- $page := site.GetPage (printf "/textbook/%s" $chapter) -}}
{{- if $page -}}
<a href="{{ $page.Permalink}}{{with .Get "id"}}#{{.}}{{end}}"
   class="chapter-reference{{ with .Get "class" }} {{ . }}{{ end }}"
   {{with .Get "target"}}target="{{ . }}"{{ end }}
   {{with .Get "rel"}}rel="{{ . }}"{{ end }}
   {{with .Get "data-bs-toggle"}}data-bs-toggle="{{ . }}"{{ end }}
   {{with .Get "role"}}role="{{ . }}"{{ end }}
   {{with .Get "aria-controls"}}aria-controls="{{ . }}"{{ end }}>
  {{- partial "links/chapter-label.html" (dict "page" $page "text" .Inner) -}}</a>
{{- else -}}
{{ errorf "Chapter not found: %s (%s)" $chapter .Position }}
{{- end -}}
