name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Hugo version
        id: hugo
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true
      - run: npm ci
      - run: npm run setup:browsers -- --with-deps
      - name: Run required tests
        run: npm test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            tmp/playwright-report/
            tmp/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload tested site
        uses: actions/upload-artifact@v4
        with:
          name: tested-site
          path: tmp/site/
          retention-days: 7

  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:prose
      - run: npm run test:prose
        env:
          VALE_BIN: tmp/bin/vale
      - run: npm run lint:prose
        env:
          VALE_BIN: tmp/bin/vale
      - name: Upload advisory prose report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prose-report
          path: tmp/prose-report.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy tested site
    # Publish only after the required tests have passed.
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: logicalmethods.ai
