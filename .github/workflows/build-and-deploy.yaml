name: Build and deploy
run-name: >-
  ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Deploy logicalmethods.ai' || 'Check logicalmethods.ai' }}
  — ${{ github.event.pull_request.title || github.event.head_commit.message || format('Manual run on {0} by @{1}', github.ref_name, github.actor) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an active production deployment finish; superseded PR checks can stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Hugo version
        id: hugo
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true
      - run: npm ci
      - run: npm run setup:browsers -- --with-deps
      - name: Run required tests
        run: npm test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            tmp/playwright-report/
            tmp/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload tested GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/site/
          retention-days: 7

  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:prose
      - run: npm run test:prose
        env:
          VALE_BIN: tmp/bin/vale
      - run: npm run lint:prose
        env:
          VALE_BIN: tmp/bin/vale
      - name: Upload advisory prose report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prose-report
          path: tmp/prose-report.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy logicalmethods.ai · main · run ${{ github.run_number }}
    # Publish only after the required tests have passed.
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
